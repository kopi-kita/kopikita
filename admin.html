<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KopiKita Admin</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>body{margin:0;background:#f8fafc}</style>
</head>
<body>
<div id="root"></div>
<script>
/* Tampilkan error di layar supaya tidak blank */
function showErr(m){var r=document.getElementById("root");if(r&&!r.children.length){r.innerHTML='<pre style="white-space:pre-wrap;padding:16px;color:#b91c1c;font-size:12px">Error: '+String(m).replace(/</g,"&lt;")+'</pre>'}}
window.addEventListener("error",function(e){showErr(e.message)});
window.addEventListener("unhandledrejection",function(e){showErr(e.reason&&e.reason.message||e.reason)});
</script>
<script type="text/babel" data-presets="react" src="/admin-1.js"></script>
<script type="text/babel" data-presets="react" src="/admin-2.js"></script>
</body>
</html>
